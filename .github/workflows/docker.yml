name: Docker

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .github/workflows/docker.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - .github/workflows/docker.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet
      - run: docker compose up -d --build turso
      - run: |
          for attempt in {1..30}; do
            if [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" == 404 ]]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs turso
          exit 1
