name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check version and prepare image tags
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match workspace version v$version" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:$RELEASE_TAG"
            if [[ "$version" != *-* ]]; then
              echo "$image:latest"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: BUILD_PROFILE=dist
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          printf 'Container image: `%s:%s`\n\n```sh\ndocker pull %s:%s\ndocker run -d --name turso -p 127.0.0.1:8080:8080 -v turso-data:/data %s:%s\n```\n\nThis is a sync HTTP service, not a general SQL endpoint. It has no authentication; do not expose its port publicly.\n' \
            "$IMAGE" "$RELEASE_TAG" "$IMAGE" "$RELEASE_TAG" "$IMAGE" "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
